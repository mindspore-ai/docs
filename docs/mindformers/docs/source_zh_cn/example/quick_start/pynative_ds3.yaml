# MindSpore Transformers 动态图（PyNative）快速开始示例配置
# 用途：DeepSeek-V3 最小规模预训练（2 卡），配套文档「快速开始」
# 使用：将 train_dataset.dataloader.config.data_path 中的路径替换为你的 Megatron bin 数据前缀后，
#       在 mindformers 仓库根目录执行：
#       msrun --worker_num=2 --local_worker_num=2 --master_port=8118 --join=True \
#             --log_dir=./msrun_log run_mindformer.py --config pynative_ds3.yaml --mode 1
checkpoint:
  enable_save: False              # 快速验证可先不保存权重
  save_path: "./output/ds3"

training:
  steps: 10                       # 训练步数
  local_batch_size: 1             # 每卡（每次前向）的 batch size
  global_batch_size: 2            # 全局 batch size，见下方说明
  max_norm: 1.0                   # 梯度裁剪（> 0 时生效）
  seed: 42

parallelism:
  data_parallel_shard: -1         # FSDP，-1 表示按可用卡数自动切分
  expert_parallel: 1
  tensor_parallel: 1
  context_parallel: 1
  pipeline_parallel: 1
  moe_token_dispatcher_type: "alltoall"   # MoE token 派发方式：alltoall / alltoall_deredundancy
  # SP 随 TP 自动开启，当前不支持关闭（无需配置此项，详见分布式并行训练文档）

optimizer:
  type: AdamW
  betas: [0.9, 0.95]
  eps: 1.e-8
  weight_decay: 0.01

lr_scheduler:
  type: ConstantWarmUpLR
  learning_rate: 1.e-5
  warmup_ratio: 0

train_dataset:
  dataloader:
    type: BlendedMegatronDatasetDataLoader
    datasets_type: "GPTDataset"
    sizes: [1000, 0, 0]           # [训练, 测试, 评估] 样本数；当前仅训练集生效
    column_names: ["input_ids", "labels", "loss_mask", "position_ids"]
    shuffle: false
    config:
      seed: 1234
      seq_length: 4096            # 须与 model.seq_length 一致
      split: "1, 0, 0"            # [训练,测试,评估] 划分；设了 data_path 即必填，缺失会报错
      eod: 1                      # 数据集中 eod(eos) 的 token id
      pad: -1                     # 数据集中 pad 的 token id
      eod_mask_loss: False
      reset_position_ids: False
      create_attention_mask: False  # 输出 4 列；若设 True 需在 column_names 增列 attention_mask
      reset_attention_mask: False
      create_compressed_eod_mask: False
      eod_pad_length: 128
      data_path:                  # 采样权重(相对值,自动归一化) + bin 前缀(含 _text_document)
        - '1'
        - "/path/megatron_data_text_document"
  drop_remainder: True
  num_parallel_workers: 8

# ===== model：模型结构超参（DeepSeek-V3 最小规格，平铺写法）=====
model:
  model_type: deepseek_v3
  architectures: DeepseekV3ForCausalLM
  vocab_size: 129280
  seq_length: 4096
  hidden_size: 1792
  intermediate_size: 3072
  num_hidden_layers: 12
  max_position_embeddings: 163840
  hidden_act: "silu"
  num_attention_heads: 8
  rms_norm_eps: 1.e-6
  add_bias_linear: False
  use_flash_attention: True
  multi_latent_attention: True
  mla_qkv_concat: True
  kv_lora_rank: 512
  q_lora_rank: 1536
  qk_rope_head_dim: 64
  v_head_dim: 192
  qk_nope_head_dim: 128
  qk_layernorm: True
  attention_dropout: 0.0
  hidden_dropout: 0.0
  params_dtype: "bfloat16"
  compute_dtype: "bfloat16"
  layernorm_compute_dtype: "float32"
  softmax_compute_dtype: "float32"
  rotary_dtype: "float32"
  initializer_range: 0.01
  num_nextn_predict_layers: 0
  mtp_loss_scaling_factor: 0.3
  position_embedding_type: "yarn"
  scaling_factor: 40
  beta_fast: 32
  beta_slow: 1
  mscale: 1
  mscale_all_dim: 1
  rope_theta: 10000
  # moe config
  router_dense_type: "float32"
  gated_linear_unit: True
  moe_intermediate_size: 1024
  routed_scaling_factor: 2.5
  first_k_dense_replace: 1
  n_routed_experts: 8
  num_experts_per_tok: 4
  n_shared_experts: 1
  moe_shared_expert_intermediate_size: 1024
  moe_grouped_gemm: True
  moe_router_load_balancing_type: "seq_aux_loss"
  moe_aux_loss_coeff: 0.001
  scoring_func: "sigmoid"
  norm_topk_prob: True
  moe_token_drop_policy: probs
  moe_router_enable_expert_bias: True
  moe_router_bias_update_rate: 0.001
  use_pad_tokens: True
  topk_group: 2
  n_group: 4

