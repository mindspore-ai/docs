<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1040" font-family="Arial,Helvetica,sans-serif">
  <defs>
    <linearGradient id="arrowGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFC46B"/>
      <stop offset="1" stop-color="#FF8A4C"/>
    </linearGradient>
    <filter id="soft" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2.5" flood-color="#3a3f7a" flood-opacity="0.14"/>
    </filter>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="1400" height="1040" fill="#FFFFFF"/>

  <!-- ============ ENTRY LAYER ============ -->
  <rect x="32" y="26" width="1336" height="60" rx="12" fill="#EEF0FB" stroke="#C7CCEC"/>
  <text x="120" y="62" font-size="20" font-weight="700" fill="#2A2E5A" text-anchor="middle">Entry Layer</text>
  <rect x="230" y="38" width="1128" height="36" rx="8" fill="#FFFFFF" stroke="#DEE2F1" filter="url(#soft)"/>
  <text x="794" y="62" font-size="17" fill="#303F9F" text-anchor="middle">
    <tspan font-weight="700">run_mindformer.py --mode 1</tspan><tspan fill="#5b5f86"> · PyNative routing (config.mode == 1)</tspan>
  </text>

  <!-- chevron -->
  <path d="M700 90 L714 90 L707 100 Z" fill="#9aa0d0"/>

  <!-- ============ CONTROL LAYER (Trainer) ============ -->
  <rect x="32" y="104" width="1336" height="72" rx="12" fill="#E3E7FA" stroke="#B9C0EA"/>
  <text x="120" y="136" font-size="20" font-weight="700" fill="#2A2E5A" text-anchor="middle">Control Layer</text>
  <text x="120" y="158" font-size="12.5" fill="#6165a0" text-anchor="middle">pynative.trainer</text>
  <rect x="230" y="116" width="1128" height="48" rx="9" fill="#FFFFFF" stroke="#DEE2F1" filter="url(#soft)"/>
  <text x="794" y="139" font-size="17" font-weight="700" fill="#303F9F" text-anchor="middle">Trainer · Training Orchestrator</text>
  <text x="794" y="157" font-size="12.5" fill="#5b5f86" text-anchor="middle">Builds model / dataset / optimizer · Drives training loop (forward → backward → gradient sync → save) · Tracks state / resumes training</text>

  <!-- chevron -->
  <path d="M700 180 L714 180 L707 190 Z" fill="#9aa0d0"/>

  <!-- ============ MAIN CONTAINER ============ -->
  <rect x="20" y="196" width="1360" height="604" rx="16" fill="#F6F7FD" stroke="#C7CCEC" stroke-width="1.5"/>
  <text x="44" y="228" font-size="18" font-weight="700" fill="#2A2E5A">MindSpore Transformers · Dynamic Graph (PyNative) Training Stack</text>
  <text x="1356" y="228" font-size="13" fill="#8085b5" text-anchor="end">Source: mindformers/pynative/</text>

  <!-- ===== LEFT: MODEL ARCHITECTURE ===== -->
  <rect x="40" y="246" width="860" height="428" rx="12" fill="#E7F5EA" stroke="#BBE0C2"/>
  <rect x="52" y="258" width="836" height="42" rx="8" fill="#C9E9CF"/>
  <text x="66" y="285" font-size="15.5" font-weight="700" fill="#256C33">Model Architecture</text>
  <text x="575" y="285" font-size="13.5" fill="#2f6b3a" text-anchor="middle">Unified GPTModel interface (Dense / MoE) · ModuleSpec assembly · Dynamic graph parallelism + operator fusion</text>

  <!-- sub-band A: GPTModel / base_models -->
  <rect x="52" y="310" width="600" height="82" rx="9" fill="#FFFFFF" stroke="#DEE2F1" filter="url(#soft)"/>
  <text x="68" y="334" font-size="14.5" font-weight="700" fill="#2A2E5A">base_models/gpt · GPTModel</text>
  <text x="68" y="356" font-size="12.5" fill="#5b5f86">General PreTrained Model — unified interface for Dense / MoE</text>
  <text x="68" y="376" font-size="12.5" fill="#5b5f86">gpt_layer_specs / moe_module_specs (ModuleSpec assembly)</text>
  <rect x="664" y="310" width="224" height="82" rx="9" fill="#FFFFFF" stroke="#DEE2F1" filter="url(#soft)"/>
  <text x="776" y="334" font-size="13.5" font-weight="700" fill="#2A2E5A" text-anchor="middle">base_models/common</text>
  <text x="776" y="356" font-size="12.5" fill="#5b5f86" text-anchor="middle">positional embeddings</text>
  <text x="776" y="376" font-size="12.5" fill="#5b5f86" text-anchor="middle">RoPE · YaRN (used by layers)</text>

  <!-- down arrow -->
  <path d="M356 393 L356 402 M348 398 L356 406 L364 398" stroke="#9aa0d0" stroke-width="1.6" fill="none"/>

  <!-- sub-band B: transformers -->
  <rect x="52" y="410" width="836" height="118" rx="9" fill="#FFFFFF" stroke="#DEE2F1" filter="url(#soft)"/>
  <text x="68" y="434" font-size="14.5" font-weight="700" fill="#2A2E5A">transformers · Transformer Components</text>
  <g font-size="12.5" fill="#33517a">
    <rect x="68" y="446" width="120" height="30" rx="6" fill="#EEF3FB" stroke="#D3DEF0"/><text x="128" y="466" text-anchor="middle">Attention</text>
    <rect x="196" y="446" width="70" height="30" rx="6" fill="#EEF3FB" stroke="#D3DEF0"/><text x="231" y="466" text-anchor="middle">MLA</text>
    <rect x="274" y="446" width="70" height="30" rx="6" fill="#EEF3FB" stroke="#D3DEF0"/><text x="309" y="466" text-anchor="middle">MTP</text>
    <rect x="352" y="446" width="220" height="30" rx="6" fill="#EEF3FB" stroke="#D3DEF0"/><text x="462" y="466" text-anchor="middle">TransformerLayer / Block</text>
    <rect x="580" y="446" width="70" height="30" rx="6" fill="#EEF3FB" stroke="#D3DEF0"/><text x="615" y="466" text-anchor="middle">MLP</text>
    <rect x="658" y="446" width="70" height="30" rx="6" fill="#EEF3FB" stroke="#D3DEF0"/><text x="693" y="466" text-anchor="middle">MoE</text>
    <rect x="736" y="446" width="140" height="30" rx="6" fill="#EEF3FB" stroke="#D3DEF0"/><text x="806" y="466" text-anchor="middle">HyperConnection</text>
  </g>
  <text x="68" y="500" font-size="12" fill="#7a7fa8">moe/ submodules: router · experts · shared_experts · moe_layer</text>
  <text x="68" y="519" font-size="12" fill="#7a7fa8">experimental_attention_variant/ (pluggable attention variants)</text>

  <!-- down arrow -->
  <path d="M470 529 L470 538 M462 534 L470 542 L478 534" stroke="#9aa0d0" stroke-width="1.6" fill="none"/>

  <!-- sub-band C: layers -->
  <rect x="52" y="546" width="836" height="114" rx="9" fill="#FFFFFF" stroke="#DEE2F1" filter="url(#soft)"/>
  <text x="68" y="570" font-size="14.5" font-weight="700" fill="#2A2E5A">layers · Fundamental Layers (Fused Operators)</text>
  <g font-size="12.5" fill="#33517a">
    <rect x="68" y="582" width="90" height="30" rx="6" fill="#EEF3FB" stroke="#D3DEF0"/><text x="113" y="602" text-anchor="middle">Linear</text>
    <rect x="166" y="582" width="110" height="30" rx="6" fill="#EEF3FB" stroke="#D3DEF0"/><text x="221" y="602" text-anchor="middle">RMSNorm</text>
    <rect x="284" y="582" width="90" height="30" rx="6" fill="#EEF3FB" stroke="#D3DEF0"/><text x="329" y="602" text-anchor="middle">SwiGlu</text>
    <rect x="382" y="582" width="150" height="30" rx="6" fill="#EEF3FB" stroke="#D3DEF0"/><text x="457" y="602" text-anchor="middle">FlashAttention</text>
    <rect x="540" y="582" width="130" height="30" rx="6" fill="#EEF3FB" stroke="#D3DEF0"/><text x="605" y="602" text-anchor="middle">Mask Generation</text>
    <rect x="678" y="582" width="90" height="30" rx="6" fill="#EEF3FB" stroke="#D3DEF0"/><text x="723" y="602" text-anchor="middle">Dropout</text>
  </g>
  <text x="68" y="638" font-size="12" fill="#7a7fa8">activation · layer_norm · identity_op — implemented with MindSpore dynamic graph operators</text>

  <!-- ===== RIGHT: TRAINING COMPONENTS AND CONFIGURATION ===== -->
  <rect x="916" y="246" width="444" height="428" rx="12" fill="#EEF0FB" stroke="#C7CCEC"/>
  <text x="1138" y="285" font-size="15.5" font-weight="700" fill="#2A2E5A" text-anchor="middle">Training Components &amp; Configuration</text>

  <rect x="930" y="300" width="416" height="66" rx="9" fill="#FFFFFF" stroke="#DEE2F1" filter="url(#soft)"/>
  <text x="946" y="324" font-size="14" font-weight="700" fill="#2A2E5A">Config (dataclass)</text>
  <text x="946" y="346" font-size="12" fill="#5b5f86">YAML → dataset / training / model / parallelism / optimizer validation</text>

  <rect x="930" y="376" width="416" height="60" rx="9" fill="#FFFFFF" stroke="#DEE2F1" filter="url(#soft)"/>
  <text x="946" y="400" font-size="14" font-weight="700" fill="#2A2E5A">Optimizer</text>
  <text x="946" y="421" font-size="12" fill="#5b5f86">AdamW · Muon (distributed synchronization + mixed precision)</text>

  <rect x="930" y="446" width="416" height="60" rx="9" fill="#FFFFFF" stroke="#DEE2F1" filter="url(#soft)"/>
  <text x="946" y="470" font-size="14" font-weight="700" fill="#2A2E5A">Loss</text>
  <text x="946" y="491" font-size="12" fill="#5b5f86">Fused cross-entropy loss (CrossEntropyLoss)</text>

  <rect x="930" y="516" width="416" height="66" rx="9" fill="#FFFFFF" stroke="#DEE2F1" filter="url(#soft)"/>
  <text x="946" y="540" font-size="14" font-weight="700" fill="#2A2E5A">Callback</text>
  <text x="946" y="562" font-size="12" fill="#5b5f86">Checkpoint saving · training resume · MaxLogits health monitoring</text>

  <rect x="930" y="592" width="416" height="66" rx="9" fill="#FFFFFF" stroke="#DEE2F1" filter="url(#soft)"/>
  <text x="946" y="616" font-size="14" font-weight="700" fill="#2A2E5A">Tools</text>
  <text x="946" y="638" font-size="12" fill="#5b5f86">High availability &amp; DFX: Monitor metrics · Profiling</text>

  <!-- ===== BOTTOM: DISTRIBUTED ===== -->
  <rect x="40" y="688" width="1320" height="98" rx="12" fill="#E7F5EA" stroke="#BBE0C2"/>
  <text x="66" y="718" font-size="14" font-weight="700" fill="#256C33">Distributed</text>
  <text x="66" y="738" font-size="11.5" fill="#5b8a63">distributed/</text>
  <g font-size="12.5" fill="#256C33">
    <rect x="220" y="702" width="150" height="34" rx="7" fill="#FFFFFF" stroke="#BBE0C2"/><text x="295" y="724" text-anchor="middle">DP (FSDP / HSDP)</text>
    <rect x="378" y="702" width="60" height="34" rx="7" fill="#FFFFFF" stroke="#BBE0C2"/><text x="408" y="724" text-anchor="middle">TP</text>
    <rect x="446" y="702" width="180" height="34" rx="7" fill="#FFFFFF" stroke="#BBE0C2"/><text x="536" y="724" text-anchor="middle">PP (1F1B / interleave)</text>
    <rect x="634" y="702" width="190" height="34" rx="7" fill="#FFFFFF" stroke="#BBE0C2"/><text x="729" y="724" text-anchor="middle">CP (Colossal / Ulysses)</text>
    <rect x="832" y="702" width="60" height="34" rx="7" fill="#FFFFFF" stroke="#BBE0C2"/><text x="862" y="724" text-anchor="middle">EP</text>
    <rect x="900" y="702" width="60" height="34" rx="7" fill="#FFFFFF" stroke="#BBE0C2"/><text x="930" y="724" text-anchor="middle">SP</text>
    <text x="978" y="724" font-size="12" fill="#5b8a63">Device mesh: dp_replicate · dp_shard · cp · tp · pp = world_size</text>
  </g>
  <g font-size="12.5" fill="#256C33">
    <text x="66" y="768" font-size="13" font-weight="700" fill="#256C33">Memory Optimization</text>
    <rect x="230" y="750" width="230" height="30" rx="7" fill="#F1FAF3" stroke="#BBE0C2"/><text x="345" y="770" text-anchor="middle">Activation Checkpointing (Full / Selective)</text>
    <rect x="468" y="750" width="150" height="30" rx="7" fill="#F1FAF3" stroke="#BBE0C2"/><text x="543" y="770" text-anchor="middle">Fine-grained SWAP</text>
    <text x="650" y="770" font-size="12" fill="#5b8a63">Communication optimization: EP overlap</text>
  </g>

  <!-- chevron -->
  <path d="M700 804 L714 804 L707 814 Z" fill="#9aa0d0"/>

  <!-- ============ FOUNDATION LAYERS ============ -->
  <rect x="32" y="818" width="1336" height="50" rx="10" fill="#E3E7FA" stroke="#B9C0EA"/>
  <text x="120" y="849" font-size="17" font-weight="700" fill="#2A2E5A" text-anchor="middle">AI Framework</text>
  <text x="794" y="849" font-size="15.5" fill="#303F9F" text-anchor="middle">MindSpore (Dynamic Graph PyNative | Hyper-Parallel | Fused Operators)</text>

  <rect x="32" y="876" width="1336" height="50" rx="10" fill="#EAEDFB" stroke="#C0C6EC"/>
  <text x="120" y="907" font-size="17" font-weight="700" fill="#2A2E5A" text-anchor="middle">Hardware Enablement</text>
  <text x="794" y="907" font-size="15.5" fill="#3d4272" text-anchor="middle">CANN</text>

  <rect x="32" y="934" width="1336" height="50" rx="10" fill="#EEF0FB" stroke="#C7CCEC"/>
  <text x="120" y="965" font-size="17" font-weight="700" fill="#2A2E5A" text-anchor="middle">Ascend AI Hardware</text>
  <text x="794" y="965" font-size="15.5" fill="#3d4272" text-anchor="middle">Atlas 800T A2 | Atlas 800I A2 | Atlas 900 A3 SuperPoD</text>

  <!-- footnote -->
  <text x="1368" y="1008" font-size="12" fill="#9095c0" text-anchor="end">Dynamic graph focuses on pre-training / fine-tuning; unsupported capabilities are provided by the static graph</text>
</svg>
